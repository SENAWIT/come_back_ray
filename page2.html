<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Evidence Wall</title>
  <style>
    body {
      background-color: #f0fff0;
      text-align: center;
      font-family: 'Comic Sans MS', cursive;
    }
    h1 {
      font-size: 2.5em;
      color: #8b0000;
      margin-top: 50px;
    }
    img {
      width: 300px;
      border: 4px solid #ff69b4;
      border-radius: 10px;
      box-shadow: 2px 2px 12px #aaa;
      margin: 20px 0;
    }
    .caption {
      font-size: 1.2em;
      color: #333;
      margin-bottom: 20px;
    }
    button {
      font-size: 1em;
      margin: 10px;
      padding: 10px 20px;
      background-color: #ff69b4;
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff1493;
    }
    a {
      display: inline-block;
      margin-top: 30px;
      font-size: 1.2em;
      color: #ffffff;
      background-color: #8b0000;
      padding: 15px 30px;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 2px 2px 8px #999;
    }
  </style>
</head>
<body>
  <h1>🧾 Evidence Wall</h1>
  <div>
    <img id="evidence-img" src="image2.jpg" alt="Evidence Image">
    <div class="caption" id="caption-text">Exhibit A: He said something sweet. My heart? Gone.</div>
  </div>
  <div>
    <button onclick="prev()">⬅️ Prev</button>
    <button onclick="next()">Next ➡️</button>
  </div>

  <script>
    const images = [
      {
        src: 'image2.jpg',
        caption: 'Exhibit A: He said something sweet. My heart? Gone.'
      },
      {
        src: 'image3.jpg',
        caption: "Exhibit B: Valentine's gift? Suspiciously romantic behavior."
      },
      {
        src: 'image5.jpg',
        caption: 'Exhibit C: Look at us smiling. This was criminally cute.'
      }
    ];

    let index = 0;

    function updateImage() {
      document.getElementById('evidence-img').src = images[index].src;
      document.getElementById('caption-text').innerText = images[index].caption;
    }

    function next() {
      index = (index + 1) % images.length;
      updateImage();
    }

    function prev() {
      index = (index - 1 + images.length) % images.length;
      updateImage();
    }
  </script>

  <br><br>
  <a href="page3.html">Proceed to the Timeline of Emotional Damage 💔</a>
</body>
</html>
